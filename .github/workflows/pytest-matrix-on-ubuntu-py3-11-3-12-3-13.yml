name: tests

# Org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers preserved verbatim from the prior local file. The leaf's
# "Create test database" step survives as `pre_test_command` (runs after
# install, before pytest); the CLI smoke lines are covered by the
# import-smoke caller instead of a bespoke step here.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  pytest-matrix:
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    with:
      # The leaf ran on ubuntu-latest; keep that destination explicit so
      # the runner choice stays locally visible (it moved upstream).
      runs_on: '["ubuntu-latest"]'
      pre_test_command: "python scripts/create_test_db.py --rows 500"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
