name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  test:
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Per-job HOME so scitex runtime state (~/.scitex/openalex-local/...)
    # and the codecov uploader write into the isolated workspace instead
    # of the shared runner home — keeps matrix legs from colliding.
    env:
      HOME: ${{ github.workspace }}
      # The corpus is PostgreSQL now, so CI needs one. This is the single
      # place a literal DSN is legitimate: it addresses the throwaway service
      # container below, is CI configuration rather than package code, and
      # points at nothing that outlives the job. The package itself never
      # builds a connection string — it asks scitex_dev.store.host_store,
      # which reads exactly this variable.
      SCITEX_STORE_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without the health check the steps start before the server accepts
        # connections, and the first one fails with a connection refusal that
        # reads like a configuration error rather than a race.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Fallback chain: prefer [all,dev] so optional-dep code paths
          # (server, mcp, docs) get exercised. Falls back to [dev] then
          # plain editable so a packaging hiccup doesn't strand CI.
          pip install -e ".[all,dev]" || pip install -e ".[dev]" || pip install -e .
      - name: Create test corpus
        run: python scripts/create_test_db.py --rows 500
      - name: Run tests
        run: |
          pytest tests/ --cov=src/openalex_local --cov-report=xml --cov-report=term
      - name: Test CLI
        run: |
          openalex-local --help
          openalex-local status || true
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
