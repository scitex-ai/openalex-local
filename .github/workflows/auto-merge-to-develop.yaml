name: auto-merge-to-develop

# Merge green PRs that TARGET develop, the moment their checks complete.
# GitHub reads check_suite-triggered workflows from the DEFAULT branch (main),
# so this file lives on main but acts ONLY on PRs whose base is develop.
#
# CONVERTED TO A CALLER, 2026-08-30 (PS-231 §1 workflow-duplication). The
# previous local body was a genuine duplicate, verified against
# scitex-ai/.github/.github/workflows/auto-merge-to-develop.yml as read on
# 2026-08-30: same `if:` guard on check_suite success, same base=develop
# filter, same codecov/readthedocs exclusion from the green test, same
# `gh pr merge --merge --admin --delete-branch`. The reusable is a superset —
# it adds a `dry_run` switch and a post-merge gate check that refuses to leave
# develop's new head un-checked. Nothing in the local copy needed an input the
# reusable lacks, so this is a conversion and not an exemption.
#
# NOT EXERCISED BY THE PR THAT CONVERTED IT, and that is a property of the
# trigger rather than an oversight: `check_suite` workflows are read from the
# default branch, so this file only takes effect once it reaches main. Verify
# after merge with `workflow_dispatch` on main before trusting it to merge
# anything unattended.

on:
  check_suite:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    uses: scitex-ai/.github/.github/workflows/auto-merge-to-develop.yml@main
    with:
      runs_on: '["ubuntu-latest"]'
