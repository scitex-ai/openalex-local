name: import-smoke

# Catches "wheel installs but `import openalex_local` blows up at runtime"
# — separate from the full pytest suite so a broken entry point fails fast
# without paying for the matrix. Confirms the bare package (no extras) is
# installable and importable, which catches `[project] dependencies` drift
# that the test matrix masks because it installs `[all,dev]`.
#
# CONVERTED TO A CALLER, 2026-08-30 (PS-231 §1 workflow-duplication). The
# previous local body was a GENUINE duplicate, verified line by line against
# scitex-ai/.github/.github/workflows/import-smoke.yml as read on 2026-08-30:
# the org body installs with the same bare `-e .` (no extras), derives the
# package name from `src/<pkg>` the same way, and publishes the same job name
# `import-smoke-on-ubuntu-py3-12`. It is a strict SUPERSET — it adds a fork
# guard ahead of `actions/checkout`, and an optional console-script assertion
# this package now opts into. There was nothing here the reusable could not
# express, so this is a conversion and not an exemption.
#
# `runs_on` is passed explicitly rather than left to default. The runner
# choice moved upstream into the reusable; it did not disappear, and keeping
# the decision locally visible is the point. A silent default is how ~30
# repositories once queued forever against an offline self-hosted pool.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    with:
      runs_on: '["ubuntu-latest"]'
      # openalex-local ships this console script. Asserting it resolves
      # against a venv install catches [project.scripts] drift, which an
      # import alone leaves passing — a different failure from a broken
      # import, and worth its own red step.
      console_script: openalex-local
