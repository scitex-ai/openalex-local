[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openalex-local"
version = "0.7.9"
description = "Local OpenAlex database with 284M+ works, abstracts, and semantic search"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [
    {name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
keywords = ["openalex", "academic", "research", "abstracts", "semantic-search"]
dependencies = [
    "click>=8.0",
    "awscli>=1.0",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.115,<0.128",
    "starlette>=0.40,<0.48",
    "fastmcp>=2.0.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest>=7.0",
    "scitex-dev>=0.11.5",
    "uvicorn>=0.23",
]
mcp = [
    "fastmcp>=2.0.0",
]
server = [
    # fastapi pulls starlette; the starlette bound must stay explicit.
    # An unbounded "fastapi>=0.100" let a shared env resolve to
    # fastapi 0.128 + starlette 1.2, which crash the relay at import
    # (Router.__init__() got an unexpected keyword argument 'on_startup').
    # Pin both to the fastapi-compatible window (starlette < 0.48).
    "fastapi>=0.115,<0.128",
    "starlette>=0.40,<0.48",
    "uvicorn>=0.23",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "openalex-local[server,mcp,dev,docs]",
]

[project.scripts]
openalex-local = "openalex_local._cli.cli:main"

[project.entry-points."scitex_dev.docs"]
openalex-local = "openalex_local"

[project.entry-points."scitex_dev.skills"]
openalex-local = "openalex_local"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/openalex-local"
Documentation = "https://openalex-local.readthedocs.io"
Repository = "https://github.com/ywatanabe1989/openalex-local"
Issues = "https://github.com/ywatanabe1989/openalex-local/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openalex_local = ["_skills/**/*.md"]

[tool.scitex_dev.audit]
# contributor-assistant/github-action reads its PAT from the env var
# PERSONAL_ACCESS_TOKEN; the repo secret of the same name (set 2026-03-11)
# is the CLA-gate token. It is the per-action CLA convention (sibling of
# the central-list CLA_PERSONAL_ACCESS_TOKEN exception), so it is exempt
# from the OPENALEX_LOCAL_ per-package prefix (PS-168).
ps168_secret_exceptions = [
    "PERSONAL_ACCESS_TOKEN",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
parallel = true
source = ["openalex_local"]
concurrency = ["multiprocessing", "thread"]
